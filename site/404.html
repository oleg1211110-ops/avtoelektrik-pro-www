<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Страница не найдена — АвтоЭлектрик PRO</title>
<meta name="description" content="Такой страницы нет. Вернитесь на главную avtoelektrik-pro.kz.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico?v=17ea34c9" sizes="48x48"><link rel="icon" href="/favicon.svg?v=c18aea20" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=760bba30">
<style>*{box-sizing:border-box}
:root{--bg:#111315;--panel:#1b1e21;--acc:#FFA500;--tx:#f2f2f2;--mut:#9aa0a6;--ln:#2a2e33}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 'Golos Text',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.bar{position:sticky;top:0;z-index:5;background:rgba(17,19,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.bar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.logo{display:flex;align-items:center;gap:8px;color:var(--tx);font-weight:800;font-size:18px}
.logo i{width:20px;height:20px;background:var(--acc);display:inline-block;clip-path:polygon(55% 0,12% 56%,47% 56%,40% 100%,88% 40%,52% 40%)}
.menu{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-right:auto}
.menu a{color:var(--mut)}
.call{color:var(--acc);font-weight:700;white-space:nowrap}
.stripe{height:3px;background:linear-gradient(90deg,var(--acc),transparent)}
main{padding:22px 0 40px}
h1{font-size:28px;line-height:1.25;margin:.2em 0 .5em}
h2{font-size:21px;margin:1.4em 0 .5em}
h3{font-size:18px;margin:1.2em 0 .4em}
.crumbs{color:var(--mut);font-size:13px;margin-bottom:14px}
.crumbs a{color:var(--mut)}
.crumbs span{color:var(--tx)}
.pmeta{color:var(--mut);font-size:13px;margin:-6px 0 14px}
.body img{max-width:100%;height:auto;border-radius:10px;margin:14px 0;background:var(--panel)}
.body ul,.body ol{padding-left:22px}
.body figure{margin:14px 0}
.body .wp-block-buttons,.f-cta{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.btn,.wp-block-button__link{display:inline-block;background:var(--acc);color:#111;font-weight:700;padding:11px 18px;border-radius:10px}
.btn:hover,.wp-block-button__link:hover{text-decoration:none;filter:brightness(1.08)}
.btn.wa,.wa .wp-block-button__link{background:#25D366;color:#073}
.ao a{display:inline-block;background:var(--panel);border:1px solid var(--acc);border-radius:10px;padding:10px 14px;margin:8px 0}
details{background:var(--panel);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:600}
.post-list{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.post-list li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ln);padding:7px 0}
.post-list time{color:var(--mut);font-size:13px;white-space:nowrap}
.more{margin:10px 0}
.related{margin:30px 0 0;padding:18px;background:var(--panel);border:1px solid var(--ln);border-radius:14px}
.related h2{margin:0 0 10px;font-size:17px}
.related ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
hr{border:0;border-top:1px solid var(--ln);margin:20px 0}
footer{border-top:1px solid var(--ln);background:var(--panel);padding:24px 0;margin-top:30px}
footer .small{color:var(--mut);font-size:13px}
@media(max-width:560px){h1{font-size:23px}.menu{display:none}.bar .wrap{gap:10px}}
</style>
</head>
<body>
<header class="bar"><div class="wrap"><a class="logo" href="/"><i aria-hidden="true"></i>АвтоЭлектрик PRO</a></div></header>
<main class="wrap"><h1>Страница не найдена</h1>
<p>Такой страницы нет или она переехала. Откройте <a href="/">главную</a> или <a href="/novosti-i-rekomendatsii">блог</a>.</p>
<p><a class="btn" href="tel:+77011211110">Позвонить +7 701 121 11 10</a></p>
</main>
</body>
</html>
